[build]
command = "npx expo export --platform web"
publish = "dist"

[[redirects]]
from = "/"
to = "/index.html"
status = 200

[[redirects]]
from = "/dashboard"
to = "/dashboard.html"
status = 200

[[redirects]]
from = "/explore"
to = "/explore.html"
status = 200

[[redirects]]
from = "/_sitemap"
to = "/_sitemap.html"
status = 200
